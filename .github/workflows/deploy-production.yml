name: Deploy main branch to Production

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - id: version
        name: Resolve release version
        env:
          BUMP: ${{ inputs.bump }}
          FORCE_NEW: ${{ inputs.force_rebuild }}
        run: |
          FLOOR=$(node -p "require('./package.json').version")
          .github/scripts/version.sh v prod "$FLOOR"

      - name: Build Application
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run build
          printf '{"version":"%s","sha":"%s"}\n' "${{ steps.version.outputs.version }}" "${{ github.sha }}" > dist/version.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Files to S3 Bucket
        run: |
          aws s3 sync ./dist s3://tkt-client-prod --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3H5JDWOCCDDJH \
            --paths "/*"