name: Deploy main branch to Production

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Bump version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if ! [[ "$CURRENT" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "version in package.json must look like 1.2.3, found '$CURRENT'"; exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          # every release increments the patch version
          PATCH=$((PATCH+1))
          NEXT="$MAJOR.$MINOR.$PATCH"
          # refuse to reuse a version that was already released
          if git ls-remote --exit-code --tags origin "refs/tags/v$NEXT" > /dev/null; then
            echo "Tag v$NEXT already exists"; exit 1
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing $NEXT (was $CURRENT)"

      - name: Build Application
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run build
          printf '{"version":"%s","sha":"%s"}\n' "${{ steps.version.outputs.version }}" "${{ github.sha }}" > dist/version.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Files to S3 Bucket
        run: |
          aws s3 sync ./dist s3://tkt-client-prod --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3H5JDWOCCDDJH \
            --paths "/*"
      # Only after a successful deploy, so a failed release never consumes a version number.
      # [skip ci] keeps this push from triggering another run.
      - name: Commit and tag version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release $VERSION [skip ci]"
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
